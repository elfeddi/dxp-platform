apiVersion: v1
kind: Namespace
metadata:
  name: dxp-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dxp-serve-config
  namespace: dxp-system
data:
  dxp.yaml: |
    version: "1.0"
    name: dxp-poc
    provider: azure
    stacks:
      - name: devops
        enabled: true
        connectors:
          - type: argocd
            name: argocd-main
            config:
              url: https://ingress-nginx-controller.ingress-nginx.svc.cluster.local/argocd
          - type: harbor
            name: harbor-main
            config:
              url: http://harbor.harbor.svc.cluster.local
          - type: grafana
            name: grafana-main
            config:
              url: http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dxp-serve
  namespace: dxp-system
  labels:
    app: dxp-serve
    version: v0.3.9
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dxp-serve
  template:
    metadata:
      labels:
        app: dxp-serve
        version: v0.3.9
    spec:
      containers:
        - name: dxp-serve
          image: harbor.dxp/dxp/dxp-serve:7e10303
          imagePullPolicy: Never
          args: ["serve", "--config", "/config/dxp.yaml", "--addr", ":8090"]
          ports:
            - containerPort: 8090
          envFrom:
            - secretRef:
                name: dxp-serve-env
          volumeMounts:
            - name: config
              mountPath: /config
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8090
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8090
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 5
      volumes:
        - name: config
          configMap:
            name: dxp-serve-config
---
apiVersion: v1
kind: Service
metadata:
  name: dxp-serve
  namespace: dxp-system
spec:
  selector:
    app: dxp-serve
  ports:
    - port: 8090
      targetPort: 8090
      nodePort: 30890
  type: NodePort