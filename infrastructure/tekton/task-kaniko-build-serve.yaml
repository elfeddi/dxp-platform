apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: kaniko-build-dxp-serve
  namespace: tekton-pipelines
  labels:
    dxp.io/managed: "true"
spec:
  params:
  - name: image
    type: string
  - name: image-tag
    type: string
  workspaces:
  - name: source
  steps:
  - name: build-push
    image: gcr.io/kaniko-project/executor:latest
    args:
    - --context=$(workspaces.source.path)/source/stack0
    - --dockerfile=$(workspaces.source.path)/source/stack0/Dockerfile
    - --destination=$(params.image):$(params.image-tag)
    - --destination=$(params.image):latest
    - --insecure
    - --skip-tls-verify
    - --insecure-pull
    volumeMounts:
    - name: docker-config
      mountPath: /kaniko/.docker
  volumes:
  - name: docker-config
    secret:
      secretName: harbor-credentials
      items:
      - key: .dockerconfigjson
        path: config.json
