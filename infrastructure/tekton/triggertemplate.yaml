apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: dxp-demo-template
  namespace: tekton-pipelines
spec:
  params:
  - name: git-url
  - name: git-revision
  - name: image
  - name: app-name
  - name: namespace
  resourcetemplates:
  - apiVersion: tekton.dev/v1
    kind: PipelineRun
    metadata:
      generateName: dxp-demo-run-
      namespace: tekton-pipelines
      labels:
        backstage.io/kubernetes-id: $(tt.params.app-name)
        dxp.io/managed: "true"
    spec:
      params:
      - name: git-url
        value: $(tt.params.git-url)
      - name: git-revision
        value: $(tt.params.git-revision)
      - name: image
        value: $(tt.params.image)
      - name: app-name
        value: $(tt.params.app-name)
      - name: namespace
        value: $(tt.params.namespace)
      pipelineRef:
        name: dxp-app-pipeline
      workspaces:
      - name: source
        volumeClaimTemplate:
          spec:
            accessModes:
            - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
