apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: dxp-golden-path-devops
  title: DxP Golden Path — Service DevOps
  description: Crée un nouveau service avec pipeline CI/CD complet — build, test, push Harbor, déploiement ArgoCD
  tags:
    - devops
    - kubernetes
    - recommended
spec:
  owner: user:guest
  type: service
  parameters:
    - title: Informations du service
      required:
        - name
        - description
        - owner
      properties:
        name:
          title: Nom du service
          type: string
          description: Nom unique du service (ex. mon-api, auth-service)
          pattern: '^[a-z][a-z0-9-]*$'
          ui:autofocus: true
        description:
          title: Description
          type: string
          description: Description courte du service
        owner:
          title: Équipe propriétaire
          type: string
          description: Équipe responsable du service
          default: team-devops
        language:
          title: Langage
          type: string
          description: Langage principal du service
          default: nodejs
          enum:
            - nodejs
            - python
            - go
          enumNames:
            - Node.js
            - Python
            - Go
    - title: Dépôt GitHub
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Dépôt GitHub
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
  steps:
    - id: fetch-base
      name: Générer le squelette du service
      action: fetch:template
      input:
        url: ./content
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          language: ${{ parameters.language }}
    - id: create-repo
      name: Créer le dépôt GitHub
      action: github:repo:create
      input:
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main
        description: ${{ parameters.description }}
    - id: publish
      name: Pousser le code
      action: github:repo:push
      input:
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main
    - id: register
      name: Enregistrer dans le catalogue DxP
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'
  output:
    links:
      - title: Voir le dépôt GitHub
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Ouvrir dans le catalogue DxP
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
