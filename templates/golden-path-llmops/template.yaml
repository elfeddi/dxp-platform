apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: dxp-golden-path-llmops
  title: DxP Golden Path — Application LLM
  description: Crée une application LLM via LiteLLM Gateway avec prompt registry et traçabilité OpenTelemetry
  tags:
    - llmops
    - llm
    - python
    - kubernetes
    - discipline:llmops
spec:
  owner: user:guest
  type: service
  parameters:
    - title: Informations de l'application
      required:
        - name
        - description
        - owner
      properties:
        name:
          title: Nom de l'application LLM
          type: string
          pattern: '^[a-z][a-z0-9-]*$'
          ui:autofocus: true
        description:
          title: Description
          type: string
        owner:
          title: Équipe propriétaire
          type: string
          default: team-ai
    - title: Dépôt GitHub
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Dépôt GitHub
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
  steps:
    - id: fetch-base
      name: Générer le squelette
      action: fetch:template
      input:
        url: ./content
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
    - id: publish
      name: Créer le dépôt
      action: publish:github
      input:
        repoUrl: ${{ parameters.repoUrl }}
        description: ${{ parameters.description }}
        defaultBranch: main
        repoVisibility: public
        protectDefaultBranch: false
    - id: register
      name: Enregistrer dans le catalogue
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'
  output:
    links:
      - title: Voir le dépôt GitHub
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Ouvrir dans le catalogue DxP
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
