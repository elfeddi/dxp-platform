apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: dxp-golden-path-react
  title: DxP Golden Path — Frontend React
  description: Crée un frontend React (Vite + nginx) avec pipeline CI/CD complet — build, push Harbor, déploiement ArgoCD
  tags:
    - devops
    - react
    - frontend
    - kubernetes
spec:
  owner: user:guest
  type: website
  parameters:
    - title: Informations du frontend
      required:
        - name
        - description
        - owner
      properties:
        name:
          title: Nom du frontend
          type: string
          pattern: '^[a-z][a-z0-9-]*$'
          ui:autofocus: true
        description:
          title: Description
          type: string
        owner:
          title: Équipe propriétaire
          type: string
          default: team-frontend
    - title: Dépôt GitHub
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Dépôt GitHub
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
  steps:
    - id: fetch-base
      name: Générer le squelette
      action: fetch:template
      input:
        url: ./content
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
    - id: publish
      name: Créer le dépôt
      action: publish:github
      input:
        repoUrl: ${{ parameters.repoUrl }}
        description: ${{ parameters.description }}
        defaultBranch: main
        repoVisibility: public
        protectDefaultBranch: false
    - id: provision
      name: Provisionner K8s
      action: http:backstage:request
      input:
        method: POST
        path: /proxy/dxp-admin/api/dxp/provision
        headers:
          Content-Type: application/json
        body:
          name: ${{ parameters.name }}
          repo: https://github.com/elfeddi/${{ parameters.name }}
          namespace: ${{ parameters.name }}-dev
          language: react
    - id: register
      name: Enregistrer dans le catalogue
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'
  output:
    links:
      - title: Voir le dépôt GitHub
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Ouvrir dans le catalogue DxP
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
